name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes (pytest)
        env:
          FLASK_SECRET_KEY: ci-test-secret-key
          GEMINI_API_KEY: ci-test-gemini-key
          ADMIN_KEY: ci-test-admin-key
          ASAAS_API_KEY: ci-test-asaas-key
        run: pytest -q
